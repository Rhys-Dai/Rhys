name: 自托管运行器测试工作流

on:
  push:
    branches:
      - main  # 当 main 分支有代码推送时触发

jobs:
  build:
    runs-on: self-hosted  # 指定使用自托管运行器
    steps:
      - name: 检出代码
        uses: actions/checkout@v4  # 拉取仓库代码到运行器

      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # 配置 .NET SDK 版本

      - name: 还原依赖
        run: dotnet restore

      - name: 构建项目
        run: dotnet build --configuration Release